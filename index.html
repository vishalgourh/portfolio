<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Gourh | Neural Logic Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --blue: #007AFF; --bg: #000; --card: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: none; }
        #cursor { width: 6px; height: 6px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
        #glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,122,255,0.07) 0%, transparent 70%); border-radius: 50%; z-index: -1; pointer-events: none; transform: translate(-50%, -50%); }
        .glass { background: var(--card); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 28px; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass:hover { border-color: var(--blue); transform: translateY(-8px); background: rgba(255,255,255,0.05); }
        .grad-text { background: linear-gradient(90deg, #fff, var(--blue), #34d399); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 8s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="glow"></div>

    <section class="min-h-screen flex flex-col justify-center items-center text-center px-6 relative">
        <div data-aos="zoom-out" class="mb-12 relative group">
            <div class="absolute inset-0 bg-blue-500 blur-[100px] opacity-10"></div>
            <img id="gh-avatar" src="" class="w-32 h-32 rounded-[2.5rem] border border-white/10 relative z-10 shadow-2xl">
            <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 glass px-6 py-2 z-20 flex items-center gap-3">
                <span class="relative h-2 w-2 bg-blue-500 rounded-full"></span>
                <span class="text-[10px] font-black tracking-widest uppercase text-blue-400">System Live</span>
            </div>
        </div>
        <h1 id="gh-name" class="text-6xl md:text-9xl font-black mb-6 grad-text uppercase leading-none tracking-tighter">...</h1>
        <p id="gh-bio" class="text-gray-500 max-w-2xl text-xs font-bold uppercase tracking-[0.4em] mb-12 italic">Syncing...</p>
        <div id="social-header" class="flex gap-8 text-xl text-gray-600"></div>
    </section>

    <section class="max-w-7xl mx-auto py-32 px-6">
        <h2 class="text-5xl font-black mb-20 italic">Source Nodes.</h2>
        <div id="repo-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200, once: true });

        // Mouse Physics
        const cursor = document.getElementById('cursor');
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        async function syncNetwork() {
            const user = 'vishalgourh';
            try {
                // Profile Fetch
                const profile = await fetch(`https://api.github.com/users/${user}`).then(r => r.json());
                document.getElementById('gh-avatar').src = profile.avatar_url;
                document.getElementById('gh-name').innerText = profile.name || user;
                document.getElementById('gh-bio').innerText = profile.bio || "AI Automation Specialist";

                // SOCIAL & UPWORK LOGIC
                // Agar Upwork link fetch nahi ho rahi, toh hum blog/website ko check karenge
                let upworkUrl = "";
                if(profile.blog && profile.blog.includes("upwork")) upworkUrl = profile.blog;

                const socialHTML = `
                    <a href="${profile.html_url}" target="_blank" class="hover:text-white transition"><i class="fab fa-github"></i></a>
                    ${upworkUrl ? `<a href="${upworkUrl}" target="_blank" class="hover:text-green-500 transition"><i class="fas fa-briefcase"></i> Upwork</a>` : ''}
                    <a href="https://linkedin.com/in/vishal-gourh" target="_blank" class="hover:text-blue-500 transition"><i class="fab fa-linkedin"></i></a>
                `;
                document.getElementById('social-header').innerHTML = socialHTML;

                // REPO FETCH (Filter applied)
                const repos = await fetch(`https://api.github.com/users/${user}/repos?sort=updated&per_page=30`).then(r => r.json());
                const grid = document.getElementById('repo-grid');
                grid.innerHTML = '';

                repos.forEach(repo => {
                    // Sirf wahi repos dikhayega jo Private nahi hain aur aapke khud ke hain (not forks)
                    if (!repo.fork) {
                        grid.innerHTML += `
                        <div class="glass p-10 flex flex-col justify-between group" data-aos="fade-up">
                            <div>
                                <span class="text-[9px] font-black px-3 py-1 bg-blue-500/10 text-blue-500 rounded border border-blue-500/20 uppercase mb-6 inline-block italic tracking-widest">${repo.language || 'Logical Node'}</span>
                                <h3 class="text-2xl font-black mb-4 tracking-tighter uppercase group-hover:text-blue-500 transition">${repo.name.replace(/-/g, ' ')}</h3>
                                <p class="text-xs text-gray-500 leading-loose italic mb-8 opacity-80">${repo.description || 'System logic and high-performance automation node.'}</p>
                            </div>
                            <div class="pt-8 border-t border-white/5 flex justify-between items-center">
                                <span class="text-[10px] text-gray-700 font-bold">STARS: ${repo.stargazers_count}</span>
                                <a href="${repo.html_url}" target="_blank" class="text-[10px] font-black text-blue-500 tracking-widest hover:mr-2 transition-all uppercase">Source // Node</a>
                            </div>
                        </div>`;
                    }
                });

            } catch (e) {
                console.error("Sync Error");
            }
        }
        syncNetwork();
    </script>
</body>
</html>
