<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Gourh | AI Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --ios-blue: #007AFF; --bg: #000; }
        body { background-color: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow-x: hidden; cursor: none; }
        #cursor { width: 12px; height: 12px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; transition: 0.4s; }
        .glass-card:hover { transform: translateY(-10px); border-color: var(--ios-blue); }
        .bg-glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,122,255,0.15) 0%, transparent 70%); border-radius: 50%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div class="bg-glow" id="glow"></div>

    <header class="min-h-[70vh] flex flex-col justify-center items-center text-center px-6">
        <div data-aos="zoom-in" class="mb-6">
            <img src="https://github.com/vishalgourh.png" class="w-32 h-32 rounded-full border-4 border-blue-600 shadow-2xl">
        </div>
        <h1 data-aos="fade-up" class="text-6xl md:text-8xl font-black mb-4 tracking-tighter">VISHAL GOURH</h1>
        <p data-aos="fade-up" data-aos-delay="200" class="text-blue-500 font-bold tracking-widest uppercase text-sm">AI & SaaS Software Architect</p>
    </header>

    <section id="projects" class="max-w-7xl mx-auto py-20 px-6">
        <h2 class="text-4xl font-bold mb-12 flex items-center gap-4">
            <i class="fab fa-github"></i> Live Repositories
        </h2>
        
        <div id="repo-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 text-gray-500 animate-pulse">
                Establishing Secure Connection to GitHub API...
            </div>
        </div>
    </section>

    <section class="max-w-7xl mx-auto py-20 px-6">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-blue-400">Scalability</div>
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-green-400">SQL Logic</div>
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-purple-400">AI Agents</div>
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-yellow-400">Power BI</div>
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-red-400">SaaS MVP</div>
            <div data-aos="fade-up" class="glass-card p-4 text-center text-[10px] font-bold uppercase tracking-widest text-pink-400">Python</div>
        </div>
    </section>

    <footer class="py-20 text-center border-t border-white/5">
        <h3 class="text-3xl font-bold mb-8">Ready to initiate a high-revenue project?</h3>
        <a href="mailto:gourhvishal25@gmail.com" class="bg-blue-600 px-12 py-4 rounded-xl font-black hover:bg-blue-500 transition-all">Direct Contact</a>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Mouse Tracker
        const cursor = document.getElementById('cursor');
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            glow.style.left = (e.clientX - 300) + 'px';
            glow.style.top = (e.clientY - 300) + 'px';
        });

        // STRICT GITHUB FETCHING
        async function fetchRealRepos() {
            const container = document.getElementById('repo-container');
            const username = 'vishalgourh';
            
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=12`);
                const repos = await response.json();
                
                // Sabse pehle loader ko clear karein
                container.innerHTML = '';

                if (repos.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-600">No public repositories found for this user.</p>';
                    return;
                }

                repos.forEach(repo => {
                    // Sirf asli repositories (jo fork nahi hain)
                    if (!repo.fork) {
                        const card = `
                        <div class="glass-card p-8 flex flex-col justify-between" data-aos="fade-up">
                            <div>
                                <div class="flex justify-between items-center mb-6">
                                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full font-bold uppercase">${repo.language || 'Software'}</span>
                                    <i class="fab fa-github text-gray-600 text-xl"></i>
                                </div>
                                <h3 class="text-xl font-bold mb-3 truncate">${repo.name}</h3>
                                <p class="text-gray-500 text-sm leading-relaxed mb-6 h-12 overflow-hidden">
                                    ${repo.description || 'Enterprise-grade system architecture and software logic implementation.'}
                                </p>
                            </div>
                            <div class="pt-6 border-t border-white/5 flex justify-between items-center">
                                <div class="flex gap-4 text-xs text-gray-600">
                                    <span><i class="fas fa-star text-yellow-500"></i> ${repo.stargazers_count}</span>
                                    <span><i class="fas fa-code-branch text-blue-500"></i> ${repo.forks_count}</span>
                                </div>
                                <a href="${repo.html_url}" target="_blank" class="text-blue-500 font-bold text-xs hover:underline">View Source →</a>
                            </div>
                        </div>`;
                        container.innerHTML += card;
                    }
                });
            } catch (error) {
                console.error("Fetch Error:", error);
                container.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold">API Sync Error. Refresh to retry.</p>';
            }
        }

        fetchRealRepos();
    </script>
</body>
</html>
