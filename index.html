<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Gourh | AI & SaaS Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #000000; }
        body { background-color: var(--ios-bg); color: white; font-family: -apple-system, sans-serif; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 28px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--ios-blue); object-fit: cover; margin: 0 auto; box-shadow: 0 0 30px rgba(0, 122, 255, 0.3); }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, #888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-4 md:p-10">

    <section class="max-w-5xl mx-auto mt-10 text-center">
        <div id="avatar-container" class="mb-6">
            <img id="gh-avatar" src="" alt="Vishal" class="profile-img hidden">
            <div id="loader" class="w-32 h-32 bg-gray-800 rounded-full animate-pulse mx-auto"></div>
        </div>

        <h1 id="gh-name" class="text-5xl md:text-7xl font-extrabold mb-4 gradient-text">Loading...</h1>
        <p id="gh-bio" class="text-xl text-gray-400 mb-8 max-w-2xl mx-auto leading-relaxed">
            Fetching profile details...
        </p>
        
        <div class="flex justify-center gap-10 mb-12 text-sm font-bold text-blue-400">
            <div><span id="gh-repos" class="text-2xl block text-white">0</span> Public Repos</div>
            <div><span id="gh-followers" class="text-2xl block text-white">0</span> Followers</div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto py-10 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fab fa-github"></i> Overall Progress</h3>
            <img class="w-full rounded-2xl" src="https://github-readme-stats.vercel.app/api?username=vishalgourh&show_icons=true&theme=tokyonight&hide_border=true" alt="Stats">
        </div>
        <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-code"></i> Tech Stack (Real-time)</h3>
            <img class="w-full rounded-2xl" src="https://github-readme-stats.vercel.app/api/top-langs/?username=vishalgourh&layout=compact&theme=tokyonight&hide_border=true" alt="Languages">
        </div>
    </section>

    <div class="flex justify-center gap-8 py-10 text-3xl">
        <a href="https://www.linkedin.com/in/vishal-gourh" target="_blank" class="hover:text-blue-500 transition"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/vishalgourh" target="_blank" class="hover:text-gray-400 transition"><i class="fab fa-github"></i></a>
        <a href="mailto:gourhvishal25@gmail.com" class="hover:text-red-500 transition"><i class="fas fa-envelope"></i></a>
    </div>

    <script>
        async function fetchGitHubData() {
            const username = 'vishalgourh';
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                const data = await response.json();

                if (data) {
                    document.getElementById('gh-avatar').src = data.avatar_url;
                    document.getElementById('gh-avatar').classList.remove('hidden');
                    document.getElementById('loader').classList.add('hidden');
                    
                    document.getElementById('gh-name').innerText = data.name || data.login;
                    document.getElementById('gh-bio').innerText = data.bio || "AI & SaaS Developer | B.Tech CST Student";
                    document.getElementById('gh-repos').innerText = data.public_repos;
                    document.getElementById('gh-followers').innerText = data.followers;
                }
            } catch (error) {
                console.error("Error fetching GitHub data:", error);
                document.getElementById('gh-name').innerText = "Vishal Gourh";
            }
        }
        fetchGitHubData();
    </script>

</body>
</html>
